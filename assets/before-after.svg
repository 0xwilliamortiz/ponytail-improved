<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Same feature two ways. Your agent: three files, fifty lines, one dependency, one open thread about timezones. Ponytail: one line, the native input type=date.">
