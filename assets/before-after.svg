<text x="552" y="33" font-size="13" letter-spacing="0.6" fill="#8b6508"><tspan font-size="15">+</tspan>  ponytail</text>
<rect x="20" y="70" width="2" height="272" fill="#e6eaef"/>
<text x="40" y="84" font-size="13" fill="#6e7781" opacity="1.0">npm i flatpickr</text>
<text x="40" y="122" font-size="13" fill="#6e7781" opacity="1.0">import flatpickr from &quot;flatpickr&quot;;</text>
<text x="40" y="141" font-size="13" fill="#6e7781" opacity="1.0">import &quot;flatpickr/dist/flatpickr.min.css&quot;;</text>
<text x="40" y="160" font-size="13" fill="#6e7781" opacity="1.0">import &quot;./date-picker.css&quot;;</text>
<text x="40" y="198" font-size="13" fill="#6e7781" opacity="1.0">export function DatePicker({ value, onChange, tz }) {</text>
<text x="40" y="217" font-size="13" fill="#6e7781" opacity="1.0">  const ref = useRef(null);</text>
<text x="40" y="236" font-size="13" fill="#6e7781" opacity="1.0">  useEffect(() =&gt; {</text>
<text x="40" y="255" font-size="13" fill="#6e7781" opacity="1.0">    const fp = flatpickr(ref.current, {</text>
<text x="40" y="274" font-size="13" fill="#6e7781" opacity="1.0">      dateFormat: &quot;Y-m-d&quot;,</text>
<text x="40" y="293" font-size="13" fill="#6e7781" opacity="0.45">      onChange: ([d]) =&gt; onChange(toUTC(d, tz)),</text>
<text x="40" y="312" font-size="13" fill="#6e7781" opacity="0.24">      // TODO: does the server want UTC or local?</text>
<text x="40" y="333" font-size="13" fill="#6e7781" opacity="0.3">&#8942;</text>
<rect x="544" y="150" width="2" height="52" fill="#8b6508" opacity="0.55"/>
<text x="564" y="172" font-size="15.5" fill="#8b6508">&lt;input type=&quot;date&quot;&gt;</text>
<text x="564" y="195" font-size="12.5" fill="#8c959f">the browser already has one</text>
<line x1="0.5" y1="320" x2="879.5" y2="320" stroke="#d1d9e0"/>
<text x="28" y="342" font-size="12" letter-spacing="0.3" fill="#59636e">3 files &#183; 50 lines &#183; 1 dependency &#183; 1 thread about timezones</text>
<text x="552" y="342" font-size="12" letter-spacing="0.3" fill="#8b6508">1 line &#183; nothing to maintain</text>
