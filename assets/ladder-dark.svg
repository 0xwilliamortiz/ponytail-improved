<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-label="The ladder, seven rungs, stop at the first one that holds: 1. does this need to exist? no. skip it (yagni); 2. is it already in this repo? reuse it; 3. does the stdlib do it? use it; 4. does the platform do it? use it; 5. does an installed dep do it? use it; 6. can it be one line? write the line; 7. nothing above held the minimum that works">
<g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace">
<rect x="0.5" y="0.5" width="879" height="383" rx="10" fill="#0d1117" stroke="#3d444d"/>
<line x1="24" y1="64" x2="852" y2="64" stroke="#22272e" stroke-width="1"/>
<line x1="43" y1="64" x2="43" y2="112" stroke="#22272e"/>
<text x="24" y="49" font-size="11.5" fill="#656c76">1</text>
<text x="48" y="50" font-size="14.5" fill="#e6edf3">does this need to exist?</text>
<text x="852" y="50" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;no. skip it (yagni)</text>
<line x1="43" y1="112" x2="852" y2="112" stroke="#22272e" stroke-width="1"/>
<line x1="62" y1="112" x2="62" y2="160" stroke="#22272e"/>
<text x="43" y="97" font-size="11.5" fill="#656c76">2</text>
<text x="67" y="98" font-size="14.5" fill="#e6edf3">is it already in this repo?</text>
<text x="852" y="98" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;reuse it</text>
<line x1="62" y1="160" x2="852" y2="160" stroke="#22272e" stroke-width="1"/>
<line x1="81" y1="160" x2="81" y2="208" stroke="#22272e"/>
<text x="62" y="145" font-size="11.5" fill="#656c76">3</text>
<text x="86" y="146" font-size="14.5" fill="#e6edf3">does the stdlib do it?</text>
<text x="852" y="146" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;use it</text>
<line x1="81" y1="208" x2="852" y2="208" stroke="#22272e" stroke-width="1"/>
<line x1="100" y1="208" x2="100" y2="256" stroke="#22272e"/>
<text x="81" y="193" font-size="11.5" fill="#656c76">4</text>
<text x="105" y="194" font-size="14.5" fill="#e6edf3">does the platform do it?</text>
<text x="852" y="194" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;use it</text>
<line x1="100" y1="256" x2="852" y2="256" stroke="#22272e" stroke-width="1"/>
<line x1="119" y1="256" x2="119" y2="304" stroke="#22272e"/>
<text x="100" y="241" font-size="11.5" fill="#656c76">5</text>
<text x="124" y="242" font-size="14.5" fill="#e6edf3">does an installed dep do it?</text>
<text x="852" y="242" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;use it</text>
<line x1="119" y1="304" x2="852" y2="304" stroke="#22272e" stroke-width="1"/>
<line x1="138" y1="304" x2="138" y2="352" stroke="#22272e"/>
<text x="119" y="289" font-size="11.5" fill="#656c76">6</text>
<text x="143" y="290" font-size="14.5" fill="#e6edf3">can it be one line?</text>
<text x="852" y="290" font-size="14.5" text-anchor="end" fill="#9198a1">&#8594;&#8194;write the line</text>
<rect x="128" y="310" width="736" height="38" rx="6" fill="#1c1a10"/>
<line x1="138" y1="352" x2="852" y2="352" stroke="#d4a72c" stroke-width="1.5"/>
<text x="138" y="337" font-size="11.5" fill="#656c76">7</text>
<text x="162" y="338" font-size="14.5" fill="#d4a72c">nothing above held</text>
<text x="852" y="338" font-size="14.5" text-anchor="end" fill="#d4a72c">&#8594;&#8194;the minimum that works</text>
</g></svg>